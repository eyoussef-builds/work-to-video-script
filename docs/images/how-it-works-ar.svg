<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="254" viewBox="0 0 1440 254" role="img" aria-labelledby="title desc"><title id="title">Work to Video Script workflow</title><desc id="desc">Approved work becomes evidence, a script and demo plan, then a user review. Explanatory diagram, not project evidence.</desc><rect width="1440" height="254" rx="24" fill="#FAF8F2"/><rect x="1082" y="26" width="316" height="200" rx="18" fill="#FFE04A"/><text x="1104" y="67" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#15130F">1</text><text x="1374" y="127" font-family="Tahoma, Arial, sans-serif" font-size="35" font-weight="700" fill="#15130F" direction="rtl" text-anchor="start">اعتمد الشغل</text><text x="1374" y="181" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="400" fill="#15130F" direction="rtl" text-anchor="start">ابدأ من المهمة المكتملة</text><rect x="734" y="26" width="316" height="200" rx="18" fill="#EFECE4"/><text x="756" y="67" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#15130F">2</text><text x="1026" y="127" font-family="Tahoma, Arial, sans-serif" font-size="35" font-weight="700" fill="#15130F" direction="rtl" text-anchor="start">اجمع الأدلة</text><text x="1026" y="181" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="400" fill="#15130F" direction="rtl" text-anchor="start">راجع المصادر والصور</text><rect x="386" y="26" width="316" height="200" rx="18" fill="#EFECE4"/><text x="408" y="67" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#15130F">3</text><text x="678" y="127" font-family="Tahoma, Arial, sans-serif" font-size="35" font-weight="700" fill="#15130F" direction="rtl" text-anchor="start">اكتب الحكاية</text><text x="678" y="181" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="400" fill="#15130F" direction="rtl" text-anchor="start">سكريبت وخطة لتصوير الديمو</text><rect x="38" y="26" width="316" height="200" rx="18" fill="#EFECE4"/><text x="60" y="67" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#15130F">4</text><text x="330" y="127" font-family="Tahoma, Arial, sans-serif" font-size="35" font-weight="700" fill="#15130F" direction="rtl" text-anchor="start">راجع النتيجة</text><text x="330" y="181" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="400" fill="#15130F" direction="rtl" text-anchor="start">وقرر إنتاج الفيديو لاحقًا</text><path d="M362 126h14" stroke="#15130F" stroke-width="3"/><path d="M368 120l-6 6 6 6" fill="none" stroke="#15130F" stroke-width="3"/><path d="M710 126h14" stroke="#15130F" stroke-width="3"/><path d="M716 120l-6 6 6 6" fill="none" stroke="#15130F" stroke-width="3"/><path d="M1058 126h14" stroke="#15130F" stroke-width="3"/><path d="M1064 120l-6 6 6 6" fill="none" stroke="#15130F" stroke-width="3"/></svg>
