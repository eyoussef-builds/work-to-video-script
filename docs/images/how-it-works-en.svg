<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="254" viewBox="0 0 1440 254" role="img" aria-labelledby="title desc"><title id="title">Work to Video Script workflow</title><desc id="desc">Approved work becomes evidence, a script and demo plan, then a user review. Explanatory diagram, not project evidence.</desc><rect width="1440" height="254" rx="24" fill="#FAF8F2"/><rect x="38" y="26" width="316" height="200" rx="18" fill="#FFE04A"/><text x="60" y="67" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#15130F">1</text><text x="58" y="127" font-family="Tahoma, Arial, sans-serif" font-size="35" font-weight="700" fill="#15130F">Work approved</text><text x="58" y="181" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#15130F">Start with the completed task</text><rect x="386" y="26" width="316" height="200" rx="18" fill="#EFECE4"/><text x="408" y="67" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#15130F">2</text><text x="406" y="127" font-family="Tahoma, Arial, sans-serif" font-size="35" font-weight="700" fill="#15130F">Real evidence</text><text x="406" y="181" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#15130F">Review sources and screenshots</text><rect x="734" y="26" width="316" height="200" rx="18" fill="#EFECE4"/><text x="756" y="67" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#15130F">3</text><text x="754" y="127" font-family="Tahoma, Arial, sans-serif" font-size="35" font-weight="700" fill="#15130F">Script + demo</text><text x="754" y="181" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#15130F">Narration and recording plan</text><rect x="1082" y="26" width="316" height="200" rx="18" fill="#EFECE4"/><text x="1104" y="67" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#15130F">4</text><text x="1102" y="127" font-family="Tahoma, Arial, sans-serif" font-size="35" font-weight="700" fill="#15130F">Your review</text><text x="1102" y="181" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#15130F">Decide on video production</text><path d="M362 126h14" stroke="#15130F" stroke-width="3"/><path d="M370 120l6 6-6 6" fill="none" stroke="#15130F" stroke-width="3"/><path d="M710 126h14" stroke="#15130F" stroke-width="3"/><path d="M718 120l6 6-6 6" fill="none" stroke="#15130F" stroke-width="3"/><path d="M1058 126h14" stroke="#15130F" stroke-width="3"/><path d="M1066 120l6 6-6 6" fill="none" stroke="#15130F" stroke-width="3"/></svg>
